<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>互動水文學</title>

<link href="index.css" rel="stylesheet">
</head>

<body>

<header>
    <h1>🌊 互動水循環系統</h1>
    <p>滑鼠移上或點擊圖中的各個過程</p>
</header>

<main>

<div class="image-container">

    <!-- 水循環圖片 -->
    <img src="water-cycle.jpeg" alt="水循環圖">

    <!-- 可點擊區域 -->
    <div class="hotspot" style="top:20%; left:15%;" onclick="showInfo('evaporation')" title="蒸發"></div>
    <div class="hotspot" style="top:15%; left:45%;" onclick="showInfo('condensation')" title="凝結"></div>
    <div class="hotspot" style="top:25%; left:75%;" onclick="showInfo('precipitation')" title="降水"></div>
    <div class="hotspot" style="top:55%; left:70%;" onclick="showInfo('runoff')" title="地表逕流"></div>
    <div class="hotspot" style="top:65%; left:50%;" onclick="showInfo('infiltration')" title="滲透"></div>

</div>

<!-- 資訊框 -->
<div id="infoBox" class="info-box">
    <span onclick="closeInfo()" class="close-btn">✖</span>
    <h2 id="infoTitle"></h2>
    <p id="infoText"></p>
</div>

</main>

<script src="index.js"></script>

</body>
</html>
