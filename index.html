    <header>
        <h1>水文學（Hydrology）</h1>

    <nav>

            <li><a href="#cycle">水循環</a></li>

        </ul>
    </nav>

    <main>
        <section id="intro">
            <h2>什麼是水文學？</h2>
            <p>
                水文學是研究地球上水的分布、運動與性質的科學，
                包含降雨、河川流動、地下水與蒸發等過程。
            </p>
        </section>

        <section id="cycle">
            <h2>水循環</h2>
            <p>
                水循環描述水在地球上的不斷循環，包括蒸發、凝結、
                降水與滲透等過程，是自然界重要的循環系統之一。
            </p>
        </section>

        <section id="importance">
            <h2>水文學的重要性</h2>
            <p>
                水文學對於水資源管理、防洪、農業灌溉以及氣候研究
                都具有重要的影響。
            </p>
        </section>
    </main>
